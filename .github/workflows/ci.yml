name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --flavor development
      - run: flutter test --flavor production test/app/build_profile_test.dart
      - run: tool/with_android_jdk.sh flutter build apk --debug --flavor development
      - run: tool/with_android_jdk.sh flutter build apk --debug --flavor production
